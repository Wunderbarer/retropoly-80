name: Build RetroPoly-80

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: JUCE herunterladen
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git JUCE

      - name: CMake konfigurieren
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Projekt kompilieren (Release)
        run: cmake --build build --config Release

      - name: Inno Setup installieren
        run: choco install innosetup -y

      - name: Installer bauen
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\installer.iss'

      - name: Setup.exe als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: RetroPoly-80-Installer
          path: installer\Output\RetroPoly-80_Setup.exe


